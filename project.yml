name: MacPiP
options:
  bundleIdPrefix: com.david
  developmentLanguage: fr
  deploymentTarget:
    macOS: "13.0"
targets:
  MacPiP:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacPiP
      - path: Xcode/Assets.xcassets
      - path: Resources
    info:
      path: Xcode/Info.plist
      properties:
        CFBundleDisplayName: AnyPiP
        CFBundleName: AnyPiP
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.video
        LSUIElement: false
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
    entitlements:
      path: Xcode/MacPiP.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: AnyPiP
        PRODUCT_BUNDLE_IDENTIFIER: com.macpip.app
        DEVELOPMENT_TEAM: GF9ZH4NVU5
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
